name: Application Flow

on:
  issues:
    types: [opened]
  pull_request:
    types: [closed]

jobs:
  ask-for-pr:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'job-application')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Comment with PR instructions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./.github/workflows/job-application-comment.js');
            await fn({ github, context, core });

  reopen-issue:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reopen the application and hand over the trial goal
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fn = require('./.github/workflows/job-application-reopen.js');
            await fn({ github, context, core });
